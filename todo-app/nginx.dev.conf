# events is required, but the defaults are fine
events { }

http {
  server {
    listen 80;

    location / {
      # Needed for Vite's live reloading (websockets)
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';

      # Pass along the address the browser used
      proxy_set_header Host $host;

      proxy_pass http://app:5173;
    }
  }
}
