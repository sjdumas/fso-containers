# events is required, but the defaults are fine
events { }

http {
  server {
    listen 80;

    # Requests starting with / go to the frontend
    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';

      proxy_set_header Host $host;

      proxy_pass http://app:5173;
    }

    # Requests starting with /api/ go to the backend
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';

      proxy_pass http://server:3000/;
    }
  }
}
