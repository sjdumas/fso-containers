services:
  frontend:
    image: phonebook-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile

  backend:
    image: phonebook-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://mongo:27017/phonebook
      - PORT=3001
    depends_on:
      - mongo

  mongo:
    image: mongo
    volumes:
      - mongo_prod_data:/data/db

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    depends_on:
      - frontend
      - backend

volumes:
  mongo_prod_data:
